[package]
name = "assetiweave"
version = "0.6.0"
description = "Local-first AI file asset management desktop app"
authors = ["AssetIWeave"]
license = "MIT"
edition = "2021"
rust-version = "1.96.0"
default-run = "assetiweave"

[lib]
name = "assetiweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
arc-swap = "1.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
globset = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
schemars = "1.2.1"
semver = "1"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tantivy = "0.26.1"
tantivy-jieba = "0.20.0"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
ureq = { version = "2", features = ["json"] }
url = "2"
tar = "0.4"
thiserror = "2"
flate2 = "1"
bzip2 = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["alloc", "NSData"] }
