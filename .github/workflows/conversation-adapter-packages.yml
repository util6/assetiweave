name: Conversation Adapter Packages

on:
  pull_request:
    paths:
      - "builtin-assets/**"
      - "scripts/conversation-adapter-packages.mjs"
      - ".github/workflows/conversation-adapter-packages.yml"
  push:
    branches: [main]
    paths:
      - "builtin-assets/**"
      - "scripts/conversation-adapter-packages.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conversation-adapters:check

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: conversation-adapter-packages-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conversation-adapters:build --update
      - name: Persist generated index and history metadata
        run: |
          if ! git diff --quiet -- builtin-assets/index.json builtin-assets/history builtin-assets/catalog.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add builtin-assets/index.json builtin-assets/history builtin-assets/catalog.json
            git commit -m "chore: update conversation adapter catalog metadata [skip ci]"
            git push
          fi
      - name: Publish immutable adapter packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view conversation-adapter-packages-main >/dev/null 2>&1; then
            existing_assets="$(gh release view conversation-adapter-packages-main --json assets --jq '.assets[].name')"
            to_upload=()
            while IFS= read -r artifact; do
              name="$(basename "$artifact")"
              if echo "$existing_assets" | grep -Fxq "$name"; then
                echo "Artifact already published, skipping: $name"
              else
                echo "Found new artifact to publish: $name"
                to_upload+=("$artifact")
              fi
            done < <(find target/conversation-adapter-packages -type f -name '*.zip' -print)
            if [ ${#to_upload[@]} -gt 0 ]; then
              gh release upload conversation-adapter-packages-main "${to_upload[@]}"
            else
              echo "All adapter packages already published in conversation-adapter-packages-main."
            fi
          else
            gh release create conversation-adapter-packages-main \
              --title "Conversation adapter packages" \
              --notes "Rolling immutable conversation adapter package artifacts." \
              target/conversation-adapter-packages/*.zip
          fi

