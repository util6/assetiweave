[package]
name = "cli"
version = "0.7.0"
description = "AssetIWeave native terminal workspace client"
authors = ["AssetIWeave"]
license = "MIT"
edition = "2021"
rust-version = "1.96.0"

[[bin]]
name = "aiwc"
path = "src/main.rs"

[dependencies]
asset_core = { path = "../asset_core" }
agent_engine = { path = "../agent_engine" }

anyhow = "=1.0.104"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
