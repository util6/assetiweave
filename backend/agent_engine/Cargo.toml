[package]
name = "agent_engine"
version = "0.7.0"
edition = "2021"
description = "Pure-computation runtime execution engine for ACP agents and multi-account sandbox"
license = "MIT"

[dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false }
anyhow = "=1.0.104"
arc-swap = "1.7"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
process-wrap = { version = "=10.0.0", features = ["tokio1"] }
regex = "1"
schemars = "1.2.1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
validator = { version = "=0.21.0", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "=0.1.44"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "=8.0.6"

[dev-dependencies]
tempfile = "3"
